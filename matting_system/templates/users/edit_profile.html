{% extends 'base.html' %}
{% load static %}

{% block title %}编辑个人资料 - 人像抠图系统{% endblock %}

{% block content %}
<div class="edit-profile-container">
    <!-- 头部导航 -->
    <div class="edit-nav">
        <a href="{% url 'users:profile' %}" class="nav-back">
            <i class="fas fa-arrow-left"></i>
            返回个人资料
        </a>
        <h1 class="edit-title">编辑个人资料</h1>
    </div>

    <div class="edit-content">
        <div class="edit-grid">
            <!-- 左侧：头像设置 -->
            <div class="edit-sidebar">
                <div class="avatar-section">
                    <h3><i class="fas fa-camera"></i> 头像设置</h3>
                    <div class="avatar-preview-container">
                        <div class="avatar-preview-large" id="avatarPreview">
                            {% if user.avatar %}
                                <img src="{{ user.avatar.url }}" alt="当前头像" id="currentAvatar">
                            {% else %}
                                <div class="avatar-default-large">
                                    <i class="fas fa-user-circle"></i>
                                </div>
                            {% endif %}
                        </div>
                        <div class="avatar-upload-zone">
                            <label for="avatarInput" class="upload-label">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <span>选择新头像</span>
                            </label>
                            <p class="upload-hint">支持 JPG、PNG 格式，最大 5MB</p>
                            <div class="avatar-actions">
                                <button type="button" class="btn-remove" id="removeAvatar">
                                    <i class="fas fa-trash"></i> 移除头像
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：表单区域 -->
            <div class="edit-main">
                <form method="post" class="edit-form" enctype="multipart/form-data">
                    {% csrf_token %}
                    <input type="file" id="avatarInput" name="avatar" accept="image/*" hidden>
                    <!-- 基本信息 -->
                    <div class="form-section">
                        <div class="section-header">
                            <h2><i class="fas fa-user"></i> 基本信息</h2>
                        </div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="username" class="form-label">
                                    <i class="fas fa-user-tag"></i>
                                    用户名
                                </label>
                                <input type="text" 
                                       id="username" 
                                       class="form-input" 
                                       value="{{ user.username }}" 
                                       readonly
                                       title="用户名不可更改">
                                <div class="form-hint">
                                    <i class="fas fa-info-circle"></i>
                                    用户名创建后不可更改
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="email" class="form-label required">
                                    <i class="fas fa-envelope"></i>
                                    邮箱地址
                                </label>
                                <input type="email" 
                                       id="email" 
                                       name="email" 
                                       class="form-input" 
                                       value="{{ user.email|default:'' }}" 
                                       placeholder="请输入邮箱地址"
                                       required>
                            </div>
                        </div>
                    </div>

                    <!-- 联系信息 -->
                    <div class="form-section">
                        <div class="section-header">
                            <h2><i class="fas fa-address-book"></i> 联系信息</h2>
                        </div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="phone" class="form-label">
                                    <i class="fas fa-phone"></i>
                                    手机号码
                                </label>
                                <input type="tel" 
                                       id="phone" 
                                       name="phone" 
                                       class="form-input" 
                                       value="{{ user.phone|default:'' }}"
                                       placeholder="请输入手机号码">
                            </div>
                        </div>
                    </div>

                    <!-- 表单操作 -->
                    <div class="form-actions">
                        <button type="submit" class="btn-submit">
                            <i class="fas fa-save"></i>
                            保存更改
                        </button>
                        <a href="{% url 'users:profile' %}" class="btn-cancel">
                            <i class="fas fa-times"></i>
                            取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .edit-profile-container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 20px;
    }

    /* 导航样式 */
    .edit-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 2px solid #e5e7eb;
    }

    .nav-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #4a6cf7;
        text-decoration: none;
        font-weight: 500;
        padding: 10px 20px;
        border-radius: 10px;
        transition: all 0.3s ease;
    }

    .nav-back:hover {
        background: rgba(74, 108, 247, 0.05);
    }

    .edit-title {
        font-size: 2.2rem;
        color: #1a1f36;
        font-weight: 700;
        margin: 0;
        background: linear-gradient(135deg, #4a6cf7 0%, #6b8aff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    /* 内容布局 */
    .edit-grid {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 30px;
    }

    @media (max-width: 900px) {
        .edit-grid {
            grid-template-columns: 1fr;
        }
    }

    /* 左侧边栏 */
    .edit-sidebar {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 30px;
        align-self: start;
    }

    .avatar-section h3 {
        color: #1a1f36;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.3rem;
    }

    .avatar-preview-container {
        text-align: center;
    }

    .avatar-preview-large {
        width: 200px;
        height: 200px;
        margin: 0 auto 20px;
        border-radius: 50%;
        border: 5px solid white;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        overflow: hidden;
        background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
    }

    .avatar-preview-large img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .avatar-default-large {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9ca3af;
        font-size: 120px;
    }

    .avatar-upload-zone {
        margin-top: 20px;
    }

    .upload-label {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 24px;
        background: linear-gradient(135deg, #4a6cf7 0%, #6b8aff 100%);
        color: white;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.3s ease;
        margin-bottom: 10px;
    }

    .upload-label:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(74, 108, 247, 0.3);
    }

    .upload-hint {
        color: #6b7280;
        font-size: 0.9rem;
        margin-bottom: 15px;
    }

    .avatar-actions {
        margin-top: 15px;
    }

    .btn-remove {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        background: #f3f4f6;
        color: #6b7280;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.3s ease;
    }

    .btn-remove:hover {
        background: #ef4444;
        color: white;
    }

    .sidebar-tips {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #e5e7eb;
    }

    .sidebar-tips h4 {
        color: #1a1f36;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.1rem;
    }

    .sidebar-tips ul {
        list-style: none;
        padding-left: 0;
    }

    .sidebar-tips li {
        color: #6b7280;
        margin-bottom: 10px;
        padding-left: 20px;
        position: relative;
    }

    .sidebar-tips li:before {
        content: '•';
        position: absolute;
        left: 0;
        color: #4a6cf7;
        font-weight: bold;
    }

    /* 右侧主内容 */
    .edit-main {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 40px;
    }

    /* 表单部分 */
    .form-section {
        margin-bottom: 40px;
    }

    .section-header {
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 2px solid #f1f5f9;
    }

    .section-header h2 {
        color: #1a1f36;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.4rem;
    }

    .form-grid {
        display: grid;
        gap: 25px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-label {
        color: #374151;
        font-weight: 600;
        font-size: 0.95rem;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .form-label.required:after {
        content: '*';
        color: #ef4444;
        margin-left: 4px;
    }

    .form-input {
        padding: 14px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        font-size: 1rem;
        transition: all 0.3s ease;
        background: #f9fafb;
    }

    .form-input:focus {
        outline: none;
        border-color: #4a6cf7;
        background: white;
        box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.1);
    }

    .form-input:read-only {
        background: #f3f4f6;
        color: #6b7280;
        cursor: not-allowed;
    }

    .form-hint {
        color: #6b7280;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
    }

    .form-hint i {
        color: #9ca3af;
    }

    /* 表单操作 */
    .form-actions {
        display: flex;
        gap: 20px;
        margin-top: 40px;
        padding-top: 30px;
        border-top: 2px solid #e5e7eb;
    }

    .btn-submit {
        flex: 1;
        padding: 16px;
        background: linear-gradient(135deg, #4a6cf7 0%, #6b8aff 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .btn-submit:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(74, 108, 247, 0.4);
    }

    .btn-cancel {
        flex: 1;
        padding: 16px;
        background: white;
        color: #6b7280;
        border: 2px solid #d1d5db;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-decoration: none;
        text-align: center;
    }

    .btn-cancel:hover {
        background: #f9fafb;
        border-color: #9ca3af;
        transform: translateY(-3px);
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
        .edit-nav {
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
        }

        .edit-title {
            font-size: 1.8rem;
        }

        .avatar-preview-large {
            width: 150px;
            height: 150px;
        }

        .avatar-default-large {
            font-size: 80px;
        }

        .form-actions {
            flex-direction: column;
        }
    }

    @media (max-width: 480px) {
        .edit-main {
            padding: 25px;
        }

        .form-input {
            padding: 12px;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const avatarInput = document.getElementById('avatarInput');
        const avatarPreview = document.getElementById('avatarPreview');
        const removeAvatarBtn = document.getElementById('removeAvatar');
        const currentAvatar = document.getElementById('currentAvatar');
        const form = document.querySelector('.edit-form');

        // 头像预览
        if (avatarInput) {
            avatarInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    // 验证文件类型
                    const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
                    if (!validTypes.includes(file.type)) {
                        alert('请选择图片文件（JPG、PNG、GIF、WebP）');
                        this.value = '';
                        return;
                    }

                    // 验证文件大小（5MB）
                    if (file.size > 5 * 1024 * 1024) {
                        alert('文件大小不能超过5MB');
                        this.value = '';
                        return;
                    }

                    // 预览图片
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        avatarPreview.innerHTML = `<img src="${e.target.result}" alt="新头像预览" style="width: 100%; height: 100%; object-fit: cover;">`;
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        // 移除头像
        if (removeAvatarBtn) {
            removeAvatarBtn.addEventListener('click', function() {
                if (confirm('确定要移除当前头像吗？')) {
                    if (avatarInput) {
                        avatarInput.value = '';
                    }
                    avatarPreview.innerHTML = `
                        <div class="avatar-default-large">
                            <i class="fas fa-user-circle"></i>
                        </div>
                    `;
                }
            });
        }

        // 表单验证
        if (form) {
            form.addEventListener('submit', function(e) {
                const emailInput = document.getElementById('email');
                const phoneInput = document.getElementById('phone');

                // 邮箱验证
                if (emailInput.value.trim()) {
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(emailInput.value.trim())) {
                        alert('请输入有效的邮箱地址');
                        emailInput.focus();
                        e.preventDefault();
                        return;
                    }
                }

                // 手机号验证（可选）
                if (phoneInput.value.trim()) {
                    const phoneRegex = /^1[3-9]\d{9}$/;
                    if (!phoneRegex.test(phoneInput.value.trim())) {
                        alert('请输入有效的中国大陆手机号码');
                        phoneInput.focus();
                        e.preventDefault();
                        return;
                    }
                }

                // 关键修复：确保文件数据被包含
                const avatarInput = document.getElementById('avatarInput');
                if (avatarInput && avatarInput.files && avatarInput.files[0]) {
                    console.log('检测到头像文件，确保包含在表单中');
                }

                // 显示加载状态
                const submitBtn = document.querySelector('.btn-submit');
                if (submitBtn) {
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 保存中...';
                    submitBtn.disabled = true;
                }
            });
        }
    });
</script>
{% endblock %}
[file content end]
